plugins {
    id 'com.android.application'
}

android {
    namespace 'br.snesbuild'
    compileSdk 36

    defaultConfig {
        applicationId "br.snesbuild.app"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // o index.html já traz o compilador em WebAssembly embutido; não comprimir nada
    androidResources {
        noCompress 'html'
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
