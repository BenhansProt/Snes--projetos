/* Layout: barra de arquivos em cima, editor no meio, console embaixo; tudo em uma coluna que serve no celular */
:root{--bg:#f3f2f7;--panel:#fff;--fg:#1d1b26;--mut:#6b6880;--line:#d9d6e4;--accent:#574a9e;--accent-fg:#fff;--ok:#1f7a4d;--err:#b3261e;--warn:#9a6700;--code:#fbfaff;--sel:#e6e2fa;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#25222c;--panel:#2f2b39;--fg:#ecebf3;--mut:#a09cb2;--line:#413c4f;--accent:#a99dff;--accent-fg:#1b1633;--ok:#5fd39a;--err:#ff8a80;--warn:#e3b341;--code:#1f1c26;--sel:#3a3558;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#25222c;--panel:#2f2b39;--fg:#ecebf3;--mut:#a09cb2;--line:#413c4f;--accent:#a99dff;--accent-fg:#1b1633;--ok:#5fd39a;--err:#ff8a80;--warn:#e3b341;--code:#1f1c26;--sel:#3a3558;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font);padding-block:12px 40px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
main{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-size:19px;margin:0;letter-spacing:.01em}
h1 small{font:12px var(--mono);color:var(--mut);margin-left:8px}
button,select,input,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 13px;min-height:42px;cursor:pointer;touch-action:manipulation}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.chip:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:650}
.btn:disabled{opacity:.45;cursor:default}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.edhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--line)}
.edhead b{font:600 13px var(--mono);flex:1 1 140px;min-width:0;overflow-wrap:anywhere}
.mini{border:1px solid var(--line);background:transparent;border-radius:6px;padding:5px 10px;font-size:13px;min-height:32px;cursor:pointer}
.mini:hover{border-color:var(--accent)}
.mini.danger{color:var(--err)}
/* ---- área de trabalho: árvore de pastas à esquerda, editor à direita ---- */
:root{--tk-com:#6b7a6a;--tk-str:#a15c00;--tk-num:#0b6e99;--tk-dir:#8a3fa8;--tk-lbl:#b3261e;--tk-op:#574a9e;--sel2:#cfc8f3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tk-com:#7f8c7e;--tk-str:#e3b17a;--tk-num:#7cc4e8;--tk-dir:#d6a3ef;--tk-lbl:#ff9e94;--tk-op:#a99dff;--sel2:#4a4380}}
:root[data-theme="dark"]{--tk-com:#7f8c7e;--tk-str:#e3b17a;--tk-num:#7cc4e8;--tk-dir:#d6a3ef;--tk-lbl:#ff9e94;--tk-op:#a99dff;--sel2:#4a4380}
.work{display:grid;grid-template-columns:240px minmax(0,1fr);gap:12px;align-items:start}
.tree{max-height:calc(46vh + 150px);min-height:200px;overflow:auto;display:flex;flex-direction:column}
.treehead{padding:9px 12px;font:600 11px var(--mono);letter-spacing:.12em;color:var(--mut);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:6px;position:sticky;top:0;background:var(--panel);z-index:1}
.treehead .mini{letter-spacing:0;font-weight:500}
#tree{padding:6px}
.trow{display:flex;width:100%;gap:6px;align-items:center;border:0;background:transparent;padding:4px 8px;text-align:left;font:13px var(--mono);color:inherit;cursor:pointer;min-height:30px;border-radius:6px;touch-action:manipulation}
.trow:hover{background:var(--sel)}
.trow[aria-selected="true"]{background:var(--sel);outline:1px solid var(--accent);outline-offset:-1px}
.trow .car{width:12px;flex:0 0 12px;color:var(--mut);font-size:10px;text-align:center}
.trow .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .sz{flex:0 0 auto;color:var(--mut);font-size:11px}
.trow.dir .nm{font-weight:650}
.trow.main .nm::before{content:"▶ ";color:var(--accent);font-size:10px}
.treeempty{padding:14px;color:var(--mut);font-size:13px}
.edpane{overflow:hidden}
.ico{display:inline-flex;align-items:center;justify-content:center;width:34px;padding:0}
.ico svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.find{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.find input{flex:1 1 130px;min-width:0;border:1px solid var(--line);background:var(--code);border-radius:7px;padding:7px 9px;font:13px var(--mono)}
.find #fcount{font:12px var(--mono);color:var(--mut);min-width:6.5em}
.mini.tog[aria-pressed="true"]{background:var(--sel2);border-color:var(--accent)}
#cmhost{border-radius:0 0 10px 10px;overflow:hidden}
@media (max-width:760px){.work{grid-template-columns:1fr}.tree{max-height:230px;min-height:0}}
/* ---- CodeMirror com as cores da página ---- */
.CodeMirror{height:430px;min-height:430px;background:var(--code);color:var(--fg);font:13px/1.5 var(--mono);resize:vertical;overflow:hidden}
.CodeMirror-gutters{background:var(--code);border-right:1px solid var(--line)}
.CodeMirror-linenumber{color:var(--mut);padding:0 8px 0 4px}
.CodeMirror-cursor{border-left:2px solid var(--fg)}
.CodeMirror-selected{background:rgba(66,133,244,.32)}
.CodeMirror-focused .CodeMirror-selected{background:rgba(66,133,244,.38)}
.cm-s-snes .cm-comment{color:var(--tk-com);font-style:italic}
.cm-s-snes .cm-string{color:var(--tk-str)}
.cm-s-snes .cm-number{color:var(--tk-num)}
.cm-s-snes .cm-meta{color:var(--tk-dir)}
.cm-s-snes .cm-def{color:var(--tk-lbl);font-weight:600}
.cm-s-snes .cm-keyword{color:var(--tk-op);font-weight:600}
.cm-searching{background:rgba(255,200,0,.28)}
.cm-curmatch{background:rgba(255,150,0,.6)}
.CodeMirror-gutter-background.cm-errnum{background:var(--err)}
.cm-errline{background:rgba(255,90,80,.16)}
.fold{width:16px}
.fm{display:block;width:16px;text-align:center;color:var(--mut);cursor:pointer;font-size:11px;line-height:1.5;user-select:none}
.fm:hover{color:var(--accent)}
.foldw{background:var(--sel);border:1px solid var(--line);border-radius:4px;padding:0 7px;margin-left:8px;color:var(--mut);cursor:pointer;font-size:11px}
.btn.danger{color:var(--err)}

/* ---- editor nativo (celular) ---- */
.taw{height:430px;min-height:430px;background:var(--code);color:var(--fg);font:13px/20px var(--mono);overflow:auto;resize:vertical;position:relative;-webkit-overflow-scrolling:touch}
.tain{display:flex;min-width:100%;min-height:100%}
.tag{position:sticky;left:0;z-index:2;flex:none;background:var(--code);border-right:1px solid var(--line);color:var(--mut);text-align:right;padding:0 8px 0 6px;min-width:34px}
.tan{height:20px}.tan.cm-errnum{background:var(--err);color:#fff}
.tabody{position:relative;flex:1 0 auto;padding:0 0 0 8px}
.tapre{white-space:pre;tab-size:4;-moz-tab-size:4;font-variant-ligatures:none;padding:0 40px 40px 0;pointer-events:none;min-height:100%}
.tal{min-height:20px;height:20px}
.tata{position:absolute;left:8px;top:0;right:0;bottom:0;width:calc(100% - 8px);height:100%;margin:0;padding:0 40px 40px 0;border:0;outline:0;resize:none;overflow:hidden;background:transparent;color:transparent;caret-color:var(--fg);font:inherit;white-space:pre;tab-size:4;-moz-tab-size:4}
.tata::selection{background:rgba(66,133,244,.38);color:transparent}
.taw{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-variant-ligatures:none}
.tata{-webkit-user-select:text;user-select:text;-webkit-tap-highlight-color:transparent}

.taw.mono .tata{color:var(--fg)}
.taw.mono .tapre{visibility:hidden}
.taw.mono .tata::selection{background:rgba(66,133,244,.38);color:inherit}

/* ---- seleção por toque longo (celular) ---- */
.tsh{position:fixed;z-index:9998;width:22px;height:22px;background:#4285f4;touch-action:none;display:none;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.tsh.l{border-radius:50% 0 50% 50%}.tsh.r{border-radius:0 50% 50% 50%}
.tsm{position:fixed;z-index:9999;display:none;background:#2b2833;color:#fff;border-radius:10px;padding:4px;box-shadow:0 2px 10px rgba(0,0,0,.45);gap:2px;font:14px system-ui,sans-serif}
.tsm button{background:transparent;border:0;color:#fff;padding:9px 12px;border-radius:8px;font:inherit}
.tsm button:active{background:rgba(255,255,255,.18)}

.bin{padding:26px 14px;color:var(--mut);font:13px var(--mono)}
#log{margin:0;padding:10px;max-height:38vh;min-height:90px;overflow:auto;font:12.5px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;background:var(--code);border-radius:0 0 10px 10px}
#log .e{color:var(--err)}#log .w{color:var(--warn)}#log .o{color:var(--ok)}#log .m{color:var(--mut)}
#log a{color:inherit;text-decoration:underline;cursor:pointer}
.sum{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px}
.sum .pill{font:12px var(--mono);padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.err{color:var(--err);border-color:var(--err)}
details.opt{padding:0}
details.opt summary{padding:11px 12px;cursor:pointer;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;padding:0 12px 12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mut);min-width:0}
label.f input[type=text]{border:1px solid var(--line);background:var(--code);border-radius:7px;padding:8px 9px;font:13px var(--mono);min-width:0}
label.c{display:flex;gap:8px;align-items:center;font-size:13.5px}
.inl{display:flex;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.inl input{flex:1 1 160px;min-width:0;border:1px solid var(--line);background:var(--code);border-radius:7px;padding:8px 9px;font:13px var(--mono)}
footer{color:var(--mut);font-size:12px}
[hidden]{display:none!important}
header h1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1 .logo{width:34px;height:34px;image-rendering:pixelated;border-radius:6px;flex:none}
header h1 small{font-weight:400}
#dbgbtn[aria-pressed="true"]{background:#2a62d9;color:#fff;border-color:#2a62d9}
#dbgpane{padding:10px;display:flex;flex-direction:column;gap:10px;font:13px var(--mono);min-height:430px}
#dbgpane[hidden]{display:none}
#dbgpane .dbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#dbgpane .dbar .pri{background:#2a62d9;color:#fff;border-color:#2a62d9}
#dbgpane .dbar button:disabled{opacity:.45}
#d_info{color:var(--mut);font-size:12px}
#d_next{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--code)}
#d_next .dis{font-weight:700;color:var(--fg)}
#d_src{height:230px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--code);-webkit-overflow-scrolling:touch;position:relative}
#d_src .sl{display:flex;min-height:20px;line-height:20px;white-space:pre;tab-size:4}
#d_src .sl .n{flex:none;width:44px;text-align:right;padding-right:8px;color:var(--mut);cursor:pointer;user-select:none}
#d_src .sl.cur{background:rgba(66,133,244,.30)}
#d_src .sl.cur .n{color:var(--fg);font-weight:700}
#d_src .sl.bp .n{background:#d33;color:#fff}
#d_src .sl.note{color:var(--mut);font-size:12px}
.dregs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dflags{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.reg,.fl{border:1px solid var(--line);border-radius:8px;background:var(--code);padding:5px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.fl{flex-direction:column;align-items:center;padding:4px 0;gap:0}
.reg i,.fl i{font-style:normal;color:var(--mut);font-size:11px}
.reg b,.fl b{font-size:15px}
.reg.chg,.fl.chg{background:rgba(255,170,0,.28);border-color:#e69500}
.dmem{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dmem label{display:flex;align-items:center;gap:4px;color:var(--mut)}
.dmem input{width:78px;font:inherit;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--code);color:var(--fg);text-transform:uppercase}
#d_mem,#d_io{margin:0;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--code);overflow:auto;font-size:12px;line-height:1.5;white-space:pre}
#d_mem b{color:var(--mut);font-weight:400}
#d_mem mark{background:rgba(255,170,0,.45);color:inherit}
.dhead{color:var(--mut);font-size:12px}
#d_stop{padding:7px 10px;border-radius:8px;background:rgba(221,51,51,.16);border:1px solid #d33}
@media(max-width:560px){.dregs{grid-template-columns:repeat(2,1fr)}.dflags{grid-template-columns:repeat(5,1fr)}}
/* visores PPU */
#dbgpane .vw{padding:6px 2px;font-size:12px;color:inherit}
.pvc{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0}
.pvc select{background:transparent;color:inherit;border:1px solid rgba(127,127,127,.5);border-radius:4px;padding:3px;font-size:12px}
.pvinfo{margin:4px 0;padding:5px 7px;background:rgba(127,127,127,.14);border-radius:5px;line-height:1.45;word-break:break-word;color:inherit}
.pvinfo b{color:#2f6fe0}
.pvh{margin:8px 0 3px;font-weight:700;opacity:.75}
.pvscroll{max-height:52vh;overflow:auto;background:#0b0d12;border:1px solid rgba(127,127,127,.4);border-radius:5px}
.pvscroll.sh{max-height:40vh}.pvscroll.mp{max-height:58vh}
.pvscroll canvas,.pvscr{image-rendering:pixelated;display:block}
.pvscroll.sh canvas,.pvscroll.mp canvas{width:100%}
.pvscr{width:100%;max-width:512px;background:#111;border:1px solid rgba(127,127,127,.4);border-radius:4px}
.pvrow{display:flex}.ruler{width:46px;flex:none;font:9px monospace;color:#9aa3b8;background:#12151d}
.ruler i{display:block;height:16px;line-height:16px;font-style:normal;text-align:right;padding-right:3px;box-sizing:border-box;border-top:1px solid #1f2533}
.rr{display:flex;gap:6px;align-items:baseline;padding:3px 4px;border-bottom:1px solid rgba(127,127,127,.25);flex-wrap:wrap}
.rr .ra{opacity:.6;font-family:monospace;width:44px}.rr .rn{font-weight:700;width:70px}.rr .rv{font-family:monospace;color:#c27a00;width:22px}.rr .rd{flex:1;min-width:140px}

      <button class="mini" id="setmain" type="button">Usar como principal</button>
      <button class="mini" id="addf" type="button">+ Novo</button>
      <button class="mini" id="ren" type="button">Renomear</button>
      <button class="mini" id="dlf" type="button">Baixar</button>
      <button class="mini danger" id="del" type="button">Apagar</button>
      <button class="mini tog" id="dbgbtn" type="button" aria-pressed="false" title="Roda a ROM passo a passo no simulador da CPU 65816">Debugger</button>
      <button class="mini tog" id="vSpr" type="button" aria-pressed="false" title="Sprites (OAM): grade, tamanho e posição">Sprites</button>
      <button class="mini tog" id="vMap" type="button" aria-pressed="false" title="Mapas dos BGs">Tilemap</button>
      <button class="mini tog" id="vTil" type="button" aria-pressed="false" title="Tiles na VRAM">Tiles</button>
      <button class="mini tog" id="vPpu" type="button" aria-pressed="false" title="Registradores da PPU">PPU</button></div>

      <button class="mini" id="fnext" type="button" title="Próximo (Enter)" aria-label="Próximo">▼</button>
      <button class="mini tog" id="fcase" type="button" aria-pressed="false" title="Diferenciar maiúsculas de minúsculas">Aa</button>
      <button class="mini tog" id="fword" type="button" aria-pressed="false" title="Palavra inteira">ab</button>

function computeFolds(){
 const n=cm.lineCount(),R=new Map(),stack=[];let lab=-1,seg=-1;
 const openRe=/^\s*\.(macro|mac|proc|scope|if|ifdef|ifndef|ifblank|ifnblank|ifconst|ifref|ifp816|ifp02|ifpsc02|repeat|rep|struct|union|enum)\b/i;
 const closeRe=/^\s*\.(endmacro|endmac|endproc|endscope|endif|endrepeat|endrep|endstruct|endunion|endenum)\b/i;
 const blank=i=>/^\s*$/.test(cm.getLine(i));
 const closeLab=e=>{if(lab>=0){while(e>lab&&blank(e))e--;if(e>lab&&!R.has(lab))R.set(lab,e);lab=-1}};
 const closeSeg=e=>{if(seg>=0){while(e>seg&&blank(e))e--;if(e>seg&&!R.has(seg))R.set(seg,e);seg=-1}};
 for(let i=0;i<n;i++){const t=cm.getLine(i);if(!t||/^\s*;/.test(t))continue;
  if(closeRe.test(t)){closeLab(i-1);const o=stack.pop();if(o!==undefined&&i-1>o&&!R.has(o))R.set(o,i-1);continue}
  if(openRe.test(t)){closeLab(i-1);stack.push(i);continue}
  if(!stack.length&&/^\s*\.segment\b/i.test(t)){closeLab(i-1);closeSeg(i-1);seg=i;continue}
  if(/^[A-Za-z_][\w]*:/.test(t)){closeLab(i-1);lab=i}}
 closeLab(n-1);closeSeg(n-1);return R}

  if(!fail&&f){rom=fs.m.get(f);okAll=true;{const kd=fs.find("game.dbg");dbgFile=kd?fs.m.get(kd):null}outFiles={};for(const k of ["game.lbl","game.map"]){const kk=fs.find(k);if(kk)outFiles[k]=fs.m.get(kk)}}
 }catch(e){errs++;log("Erro: "+(e.message||JSON.stringify(e)),"e")}
 const dt=((performance.now()-t0)/1000).toFixed(1);const sum=$("#sum");
 if(okAll){const kb=(rom.length/1024).toFixed(0);log("Pronto: "+S.o.out+" ("+kb+" KB) em "+dt+" s.","o");sum.innerHTML="";const p=document.createElement("span");p.className="pill ok";p.textContent="compilou";const t=document.createElement("span");t.textContent=S.o.out+" · "+kb+" KB · "+dt+" s"+(warns?" · "+warns+" aviso(s)":"");sum.append(p,t);$("#dlrom").disabled=false;
  for(const k in outFiles){const a=document.createElement("button");a.className="mini";a.type="button";a.textContent="Baixar "+k;a.onclick=()=>dl(k,outFiles[k]);sum.append(a)}}
 else{log("Falhou em "+dt+" s.","e");sum.innerHTML="";const p=document.createElement("span");p.className="pill err";p.textContent="erro";const t=document.createElement("span");t.textContent=(errs||1)+" erro(s). Toque no arquivo(linha) para ir até ele.";sum.append(p,t)}
 applyAllErr();b.disabled=false;b.textContent="Compilar";
}
$("#build").onclick=build;
$("#test").onclick=async()=>{await build();if(!rom)return;
 if(BR()){try{const r=BR().testar(b64(rom),S.o.out.split("/").pop(),S.o.emu.trim());log("Emulador: "+r,String(r).startsWith("ok")?"o":"e")}catch(e){log("Erro ao abrir o emulador: "+e.message,"e")}}
 else{const r=await askParent();
  if(r&&r.ok)log("Mesen: "+r.msg,"o");
  else{dl(S.o.out,rom);log((r&&r.msg?"Não abriu direto ("+r.msg+"). ":"")+"ROM baixada. Abra no emulador: arraste "+S.o.out.split("/").pop()+" para a janela dele ou use Arquivo > Abrir.","o")}}};
function askParent(){if(window.parent===window)return Promise.resolve(null);
 return new Promise(res=>{const id=Math.random();const copy=rom.slice();
  const h=e=>{if(e.data&&e.data.asmAck===id){removeEventListener("message",h);res(e.data)}};addEventListener("message",h);
  parent.postMessage({asm:"testar",id,name:S.o.out.split("/").pop(),rom:copy.buffer,emuPath:S.o.emuPath.trim()},"*",[copy.buffer]);
  setTimeout(()=>{removeEventListener("message",h);res(null)},6000)})}
$("#openemu").onclick=()=>{try{log(String(BR().abrirEmulador(S.o.emu.trim())),"m")}catch(e){log("Erro: "+e.message,"e")}};
if(BR()){$("#test").hidden=false;$("#openemu").hidden=false;$("#emurow").hidden=false}
else if(window.TESTAR_WEB){$("#test").hidden=false;$("#test").textContent=window.TESTAR_WEB;$("#emupathrow").hidden=false}

(async()=>{const r=await restore();
 if(r&&Array.isArray(r.files)){S.files=new Map(r.files);S.cur=r.cur;S.main=r.main;S.o=Object.assign(S.o,r.o);S.open=new Set(r.open||[]);S.selDir=r.selDir||"";S.selKind=r.selKind||"file";if(!S.files.has(S.cur))S.cur=[...S.files.keys()][0]||""}
 else loadSample();
