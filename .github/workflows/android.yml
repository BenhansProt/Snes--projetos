name: Gerar APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Organizar pastas
        run: |
          mkdir -p app/src/main/java/br/snesbuild app/src/main/assets app/src/main/res/xml
          mv app_build.gradle app/build.gradle
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          mv MainActivity.java app/src/main/java/br/snesbuild/MainActivity.java
          mv file_paths.xml app/src/main/res/xml/file_paths.xml
          mv index.html app/src/main/assets/index.html
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do mkdir -p app/src/main/res/mipmap-$d; mv ic_$d.png app/src/main/res/mipmap-$d/ic_launcher.png; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SnesBuild-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar o APK em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SnesBuild.apk
          gh release delete apk-atual --yes --cleanup-tag || true
          gh release create apk-atual SnesBuild.apk --title "SNES Build (APK)" --notes "APK mais recente gerado automaticamente. Baixe SnesBuild.apk e instale."
